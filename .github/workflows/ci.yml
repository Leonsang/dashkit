name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./... -count=1

      - name: build
        run: go build ./...

      # A real end-to-end run against the actual upstream skills tree, on all
      # three operating systems: this is what proves the macOS path handling,
      # not just that the code compiles for darwin. dashkit downloads and unpacks
      # the pinned upstream tag itself, so this also exercises the fetch and tar
      # extraction on each platform.
      - name: end-to-end install into a throwaway home
        shell: bash
        run: |
          set -euo pipefail
          home="$RUNNER_TEMP/dashkit-home"
          proj="$RUNNER_TEMP/project"
          mkdir -p "$proj"
          printf '# Project\n\nMy notes.\n' > "$proj/AGENTS.md"

          go run ./cmd/dashkit install \
            --bundle powerbi-authoring \
            --agents cursor,vscode-copilot,codex,gemini \
            --scope project --project "$proj" \
            --home "$home" \
            --skip-prereq-check \
            --host-plugin=false

          test -f "$proj/.cursor/rules/dashkit-powerbi-authoring.mdc"
          test -f "$proj/.github/instructions/dashkit-powerbi-authoring.instructions.md"
          test -f "$proj/.dashkit/powerbi-authoring/skills/powerbi-report-authoring/SKILL.md"
          grep -q '\[mcp_servers.powerbi-modeling-mcp\]' "$proj/.codex/config.toml"
          grep -q 'mcpServers' "$proj/.gemini/settings.json"
          grep -q 'dashkit:start:powerbi-authoring' "$proj/AGENTS.md"
          grep -q 'My notes.' "$proj/AGENTS.md"
          ! grep -rq '\.\./\.\./common/' "$proj/.dashkit"

          go run ./cmd/dashkit uninstall --home "$home"
          test ! -d "$proj/.dashkit/powerbi-authoring/skills/powerbi-report-authoring"
          grep -q 'My notes.' "$proj/AGENTS.md"
          ! grep -q 'dashkit:start' "$proj/AGENTS.md"

      - name: doctor runs and reports
        shell: bash
        run: go run ./cmd/dashkit doctor --home "$RUNNER_TEMP/dashkit-home" || true

      # The Tableau and Looker Studio bundles install their MCP server as files
      # where there is no plugin manager; prove the copy and the config wiring.
      - name: end-to-end install of the Tableau and Looker Studio bundles
        shell: bash
        run: |
          set -euo pipefail
          home="$RUNNER_TEMP/dashkit-home-2"
          proj="$RUNNER_TEMP/project-2"
          mkdir -p "$proj"
          go run ./cmd/dashkit install             --bundle tableau-authoring,looker-studio-authoring,tableau-guardrails             --agents cursor,codex             --scope project --project "$proj"             --home "$home"             --skip-prereq-check
          test -f "$proj/.dashkit/tableau-authoring/server/pyproject.toml"
          test -f "$proj/.dashkit/looker-studio-authoring/looker-studio-mcp/dist/index.js"
          grep -q 'tableau-authoring/server' "$proj/.cursor/mcp.json"
          grep -q 'looker-studio-mcp/dist/index.js' "$proj/.codex/config.toml"
          ! grep -rq 'DASHKIT_BUNDLE' "$proj/.cursor" "$proj/.codex"
          test ! -d "$proj/.dashkit/tableau-guardrails"   # hooks only run as a plugin

  # The servers dashkit ships: Tableau's Python tests, and Looker Studio's
  # committed bundle rebuilt from source to prove it matches.
  servers:
    name: bundled MCP servers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: tableu tests
        working-directory: bundles/tableau-authoring/server
        run: uv run --quiet pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: looker-studio-mcp builds, its page scripts survive bundling, and dist/ is current
        working-directory: bundles/looker-studio-authoring/looker-studio-mcp
        run: |
          npm ci --ignore-scripts
          npm rebuild esbuild
          npm run build
          node tools/check-page-scripts.mjs --minify --obfuscate
          node tools/mcp-smoke.mjs
          git diff --exit-code -- dist ../../looker-studio-guardrails/hooks

  installers:
    name: installer scripts
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: syntax check install.sh
        if: runner.os != 'Windows'
        run: bash -n install.sh

      - name: syntax check install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./install.ps1), [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors; exit 1 }
