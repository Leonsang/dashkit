[project]
name = "tableu-mcp"
version = "0.1.0"
description = "CLI + MCP server to drive a local Tableau Desktop (External Client API) and lint workbooks against Tableau best practices."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.2,<2",
  "lxml>=5",
  "httpx>=0.27",
  "openpyxl>=3.1.5",
  "tableauhyperapi>=0.0.26963",
]

[project.scripts]
tableu = "tableu_mcp.cli:main"
tableu-mcp = "tableu_mcp.server:main"

[dependency-groups]
dev = [
    "pillow>=13.0.0",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tableu_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
